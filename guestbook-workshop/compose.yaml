services:
  app:
    image: ghcr.io/vladimirk7/seed-service:v1.0.0
    build: .
    ports:
      - "8000:8000"
    environment:
      GREETING: ${GREETING}
      DATABASE_URL: "postgresql://guestbook:${POSTGRES_PASSWORD}@db:5432/guestbook"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestbook -d guestbook"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata: